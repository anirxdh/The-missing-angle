# Railway/Nixpacks — python311 has no `python` shim; use python3.11 + gcc for uvloop/httptools.
[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "python3.11 -m pip install --upgrade pip",
  "python3.11 -m pip install -r requirements.txt",
]

[start]
cmd = "python3.11 -m uvicorn server:app --host 0.0.0.0 --port ${PORT:-8000}"
